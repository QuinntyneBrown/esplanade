<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password · submitting — Esplanade mocks</title>
<meta name="mock:kind" content="page">
<meta name="mock:screen" content="forgot-password">

<link rel="stylesheet" href="../../assets/tokens.css">

<body>
<a class="skip-link" href="#main">Skip to content</a>
<canvas class="aurora" aria-hidden="true"></canvas>
<main id="main" class="auth-layout">
  <div class="auth-card stack">
    <div class="logo" aria-hidden="true"><span class="logo-mark sticker--bob"><img src="../../assets/logo.png" alt="" width="64" height="64"></span></div>
    <div class="card stack">
      <h1 style="text-align: center;">Reset your password</h1>
<p class="text-muted" style="text-align: center;">Enter the e-mail address you use for Esplanade and we’ll send you a reset link.</p>
<form class="stack" action="success.html" method="get" novalidate>
  <div class="field"><label class="field__label" for="email">E-mail address</label><input class="input" id="email" name="email" type="email" readonly value="margaret@harbourviewcoop.ca"></div>
  <button class="btn btn--primary btn--lg btn--block" type="submit" aria-busy="true" aria-label="Sending reset link">Send reset link</button>
</form>
    </div>
    <p class="text-caption" style="text-align: center;"><a href="../../pages/sign-in/default.html">Back to sign in</a></p>
  </div>
</main>
<div class="toast-region" role="status" aria-live="polite"></div>
<p class="mock-note" style="top: 1.5rem; right: 1rem;">Busy button prevents duplicate reset requests.</p>
<nav class="mock-bar" aria-label="Mock navigation">
  <a class="mock-bar__home" href="../../index.html" aria-label="All mocks">⌂</a>
  <span class="mock-bar__screen">Forgot password</span>
  <ul class="mock-bar__states"><li><a href="default.html">default</a></li><li><a href="invalid.html">invalid</a></li><li><a href="error.html">error</a></li><li><a href="submitting.html" aria-current="page">submitting</a></li><li><a href="success.html">success</a></li></ul>
  <button type="button" data-theme-toggle aria-pressed="false">☾ Dark</button>
  <button type="button" data-chrome-toggle aria-label="Hide mock chrome">×</button>
</nav>
<script src="../../assets/mock.js"></script>
<script src="../../assets/aurora.js"></script>
