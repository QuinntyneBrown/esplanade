<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password · invalid — Esplanade mocks</title>
<meta name="mock:kind" content="page">
<meta name="mock:screen" content="forgot-password">
<meta name="mock:state" content="invalid">
<meta name="mock:requirements" content="L2-003, L2-036">
<meta name="description" content="Forgot-password form when the e-mail field is invalid.">
<link rel="stylesheet" href="../../assets/tokens.css">
<link rel="stylesheet" href="../../assets/ui.css">
<link rel="stylesheet" href="../../assets/mock.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<canvas class="aurora" aria-hidden="true"></canvas>
<main id="main" class="auth-layout">
  <div class="auth-card stack">
    <div class="logo" aria-hidden="true"><span class="logo-mark sticker--bob"><img src="../../assets/logo.png" alt="" width="64" height="64"></span></div>
    <div class="card stack">
      <h1 style="text-align: center;">Reset your password</h1>
<div class="alert alert--danger form-summary" role="alert" tabindex="-1">
  <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
  <div class="alert__body">
    <div class="alert__title">Fix 1 thing</div>
    <ol><li><a href="#email">Enter a valid e-mail address</a></li></ol>
  </div>
</div>
<form class="stack" action="success.html" method="get" novalidate>
  <div class="field"><label class="field__label" for="email">E-mail address</label><input class="input" id="email" name="email" type="email" required aria-invalid="true" aria-describedby="email-err" value="not-an-email"><div class="field__error" id="email-err">Enter a valid e-mail address like margaret@harbourviewcoop.ca</div></div>
  <button class="btn btn--primary btn--lg btn--block" type="submit">Send reset link</button>
</form>
    </div>
    <p class="text-caption" style="text-align: center;"><a href="../../pages/sign-in/default.html">Back to sign in</a></p>
  </div>
</main>
<div class="toast-region" role="status" aria-live="polite"></div>
<p class="mock-note" style="top: 1.5rem; right: 1rem;">Inline validation error linked via aria-describedby.</p>
<nav class="mock-bar" aria-label="Mock navigation">
  <a class="mock-bar__home" href="../../index.html" aria-label="All mocks">⌂</a>
  <span class="mock-bar__screen">Forgot password</span>
  <ul class="mock-bar__states"><li><a href="default.html">default</a></li><li><a href="invalid.html" aria-current="page">invalid</a></li><li><a href="error.html">error</a></li><li><a href="submitting.html">submitting</a></li><li><a href="success.html">success</a></li></ul>
  <button type="button" data-theme-toggle aria-pressed="false">☾ Dark</button>
  <button type="button" data-chrome-toggle aria-label="Hide mock chrome">×</button>
</nav>
<script src="../../assets/mock.js"></script>
<script src="../../assets/aurora.js"></script>
</body>
</html>
